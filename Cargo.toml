[package]
name = "marshal"
version = "0.1.0"
edition = "2024"
description = "A native GNOME manager for MCP servers"
license = "GPL-3.0-or-later"

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_7"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_16"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
shell-words = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
rmcp = { version = "0.8", features = ["client", "server", "transport-async-rw", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
libc = "0.2"
tempfile = "3"
jsonc-parser = { version = "0.29", features = ["cst", "serde"] }
toml_edit = { version = "0.25", features = ["serde"] }
yaml-edit = "0.2"
serde_yaml = "0.9"
ksni = "0.3"

[profile.dev]
debug = 0
